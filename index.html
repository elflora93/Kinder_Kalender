<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Noras Kalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #FBF8F3; --ink: #2A2A33; --muted: #5E5A52; --line: #E2DBCF; --soft: #F1ECE3;
    --sun: #FFD866; --red: #D6453D; --blue: #2F6FB0; --green: #3E8E52;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Andika, system-ui, sans-serif; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; }
  button { font-family: inherit; color: inherit; }
  #app { height: 100dvh; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; }

  /* Kopf */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
  .top h1 { margin: 0; font-size: clamp(26px, 3.4vw, 40px); display: flex; align-items: center; gap: 12px; }
  .nav { display: flex; align-items: center; gap: 10px; }
  .round { width: 56px; height: 56px; border-radius: 28px; border: 2px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pill-btn { height: 48px; padding: 0 18px; border-radius: 24px; border: 2px solid var(--line); background: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
  .lock { width: 44px; height: 44px; border: none; background: transparent; margin-left: 8px; cursor: pointer; opacity: .6; }

  /* Raster */
  .grid { -webkit-user-select: none; user-select: none; flex: 1; min-height: 0; display: grid; grid-template-columns: 70px repeat(3, minmax(0, 1fr)); grid-template-rows: 80px 1fr; column-gap: 12px; row-gap: 8px; touch-action: pan-y; }
  .dayhead { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-radius: 16px; background: #fff; border: 2px solid var(--line); }
  .dayhead .name { font-size: clamp(20px, 2.2vw, 26px); font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .dayhead .date { font-size: 15px; color: var(--muted); }
  .dayhead.today { background: var(--sun); border-color: var(--sun); }
  .dayhead.today .date { color: var(--ink); }
  .dayhead.kita { background: #EEF0F3; border-color: #8C97A6; }
  .dayhead.urlaub { background: #FFE3C7; border-color: #F0A04B; }
  .tag { font-size: 14px; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
  .tag.today { background: var(--ink); color: #fff; }
  .tag.we { background: #E3F2E5; color: #3E7A4E; }

  .timecol { position: relative; }
  .timecol .h { position: absolute; right: 0; font-size: 15px; font-weight: 700; color: var(--muted); transform: translateY(-50%); }
  .timecol .scene { position: absolute; left: -4px; }
  .timecol .now { position: absolute; left: -4px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--red); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; transform: translateY(-50%); }

  .day { position: relative; border-radius: 16px; border: 2px solid var(--line); background: #fff; overflow: hidden; cursor: pointer; }
  .day.today { border: 4px solid var(--sun); box-shadow: 0 6px 20px rgba(224,164,34,.25); }
  .day.kita { border-color: #8C97A6; }
  .day.urlaub { border-color: #F0A04B; background: #FFF4E8; }
  .band { position: absolute; left: 0; right: 0; pointer-events: none; }
  .hourlines { position: absolute; inset: 0; pointer-events: none; }
  .nowline { position: absolute; left: 0; right: 0; height: 4px; background: var(--red); pointer-events: none; z-index: 5; }
  .nowdot { position: absolute; left: -2px; width: 16px; height: 16px; border-radius: 8px; background: var(--red); transform: translateY(-6px); pointer-events: none; z-index: 5; }

  .card { position: absolute; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: #fff; border: 3px solid #ccc; border-radius: 12px; overflow: hidden; z-index: 2; cursor: default; }
  .card .lbl { font-size: clamp(16px, 1.7vw, 21px); font-weight: 700; line-height: 1.1; }
  .card.tall { flex-direction: column; justify-content: center; text-align: center; gap: 6px; }
  .sportbadge { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 8px; padding: 6px 10px; border-radius: 12px; background: #FFF1E3; border: 2px solid #F0A04B; color: #B4561A; font-weight: 700; }
  .card.kitablock { background: rgba(255,255,255,.6); border: 2px dashed #8DB5DA; color: var(--blue); z-index: 1; }
  .card .star { margin-left: auto; flex-shrink: 0; }
  .card.tall .star { position: absolute; top: 6px; right: 6px; margin: 0; }
  .av { flex-shrink: 0; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; background-size: cover; background-position: center; }

  /* Overlays */
  .overlay { position: fixed; inset: 0; background: rgba(42,42,51,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .sheet { background: #fff; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.25); padding: 28px 32px; width: min(780px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 20px; }
  .sheet h2 { margin: 0; font-size: 34px; }
  .sub { font-size: 18px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .tile { height: 150px; border-radius: 20px; border: 3px solid var(--line); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-size: 22px; font-weight: 700; }
  .tile.on { border: 5px solid #E0A422; background: #FFF6D6; }
  .done-btn { align-self: center; width: 300px; height: 76px; border-radius: 38px; border: none; background: var(--green); color: #fff; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; }
  .done-btn:disabled { opacity: .35; }
  .timerow { display: flex; align-items: center; gap: 28px; padding: 14px 18px; background: #F6F2EB; border-radius: 16px; flex-wrap: wrap; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .step button { width: 44px; height: 44px; border-radius: 22px; border: 2px solid var(--line); background: #fff; font-size: 24px; font-weight: 700; cursor: pointer; }
  .step .val { width: 64px; text-align: center; font-size: 22px; }

  /* Eltern */
  .parent { position: fixed; inset: 0; background: var(--bg); z-index: 40; display: flex; }
  .side { width: 240px; flex-shrink: 0; background: #F1ECE3; padding: 22px 14px; display: flex; flex-direction: column; gap: 6px; }
  .side .brand { font-size: 22px; font-weight: 700; padding: 0 8px 16px; }
  .side button { height: 52px; border-radius: 12px; border: none; background: transparent; text-align: left; padding: 0 14px; font-size: 19px; font-weight: 700; color: #4A463F; cursor: pointer; }
  .side button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(42,42,51,.08); }
  .side .back { margin-top: auto; border: 2px solid #D9D1C3; }
  .side .tabs { display: flex; flex-direction: column; gap: 6px; }
  .mtoggle { display: none; }
  .icgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .main { flex: 1; min-width: 0; overflow: auto; padding: 26px 30px; display: flex; flex-direction: column; gap: 18px; }
  .main h2 { margin: 0; font-size: 32px; }
  .cards3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
  .pcard { background: #fff; border: 2px solid #E7E1D8; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .pcard input[type=text] { font-family: inherit; font-size: 22px; font-weight: 700; border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; width: 100%; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw { width: 32px; height: 32px; border-radius: 16px; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .sw.on { border: 3px solid var(--ink); }
  .filebtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .wk { display: grid; grid-template-columns: 120px repeat(7, minmax(0, 1fr)); gap: 8px; align-items: center; }
  .wk .hd { height: 44px; border-radius: 10px; background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; }
  .wk .hd.we { background: #E3F2E5; color: #3E7A4E; }
  .wk .rl { font-size: 18px; font-weight: 700; }
  .wk .cell { height: 84px; border-radius: 12px; border: 2px solid #E7E1D8; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .opt { height: 112px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .opt.on { border: 4px solid #E0A422; background: #FFF6D6; }
  .month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .month .wd { text-align: center; font-size: 15px; font-weight: 700; color: var(--muted); }
  .month .d { height: 62px; border-radius: 12px; border: 2px solid #EFEAE1; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; cursor: pointer; }
  .modes { display: flex; gap: 10px; flex-wrap: wrap; }
  .modes button { flex: 1; min-width: 150px; height: 52px; border-radius: 14px; border: 2px solid var(--line); font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
  .modes button.on { border: 3px solid var(--ink); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #fff; border: 2px solid #E7E1D8; border-radius: 14px; }
  .muted { color: var(--muted); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 300px; align-self: center; }
  .keypad button { height: 64px; border-radius: 16px; border: 2px solid var(--line); background: #fff; font-size: 26px; font-weight: 700; cursor: pointer; }
  .hidden { display: none !important; }

  /* Startseite (Übersicht) */
  #home { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.2fr 1.25fr .95fr; gap: 16px; }
  #app:not(.homeview) #home, #app.homeview #grid, #app.homeview #prevBtn, #app.homeview #nextBtn, #app.homeview #todayBtn, #app.homeview #homeBtn { display: none !important; }
  .panel { background: #fff; border: 2px solid var(--line); border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden; }
  .panel h2 { margin: 0; font-size: clamp(22px, 2.4vw, 30px); display: flex; align-items: center; gap: 10px; }
  .panel h2 svg { flex-shrink: 0; }
  .panel.plan { cursor: pointer; }
  .panel.plan.today { border: 4px solid var(--sun); }
  .hlist { display: flex; flex-direction: column; gap: 8px; overflow: auto; min-height: 0; flex: 1; }
  .hrow { display: flex; align-items: center; gap: 12px; padding: 6px 12px; min-height: 58px; border-radius: 14px; border: 3px solid #ccc; background: #fff; flex-shrink: 0; }
  .hrow .t { font-size: 19px; font-weight: 700; color: var(--muted); width: 58px; flex-shrink: 0; }
  .hrow .l { font-size: clamp(18px, 1.9vw, 23px); font-weight: 700; line-height: 1.15; }
  .hrow.past { opacity: .4; }
  .hrow.kitarow { background: #EAF3FB; border-color: #9DBBDD; }
  .hint { margin-top: auto; text-align: center; color: var(--muted); font-size: 16px; }
  .wnow { display: flex; align-items: center; gap: 14px; }
  .wnow .temp { font-size: clamp(40px, 4.4vw, 56px); font-weight: 700; line-height: 1; }
  .wday { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--bg); }
  .wday .n { font-size: 19px; font-weight: 700; width: 70px; flex-shrink: 0; }
  .wday .mm { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .wday svg, .wnow svg, .hours svg { flex-shrink: 0; }
  .rain { display: inline-flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 700; color: #2F6FB0; margin-left: auto; white-space: nowrap; }
  .hours { display: flex; gap: 3px; align-items: flex-end; height: 84px; flex-shrink: 0; margin: 4px 0; }
  .hours .c { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; font-size: 12px; color: var(--muted); height: 100%; }
  .hours .bar { width: 70%; background: #8DB8E6; border-radius: 3px 3px 0 0; }
  .hours .tt { font-size: 13px; font-weight: 700; color: var(--ink); }
  .anz { background: #F6F2EB; border-radius: 16px; padding: 8px 12px; display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .anz-kind { flex-shrink: 0; }
  .anz-kind svg { height: clamp(150px, 30vh, 300px); width: auto; display: block; }
  .anz-t { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .anz-r { display: flex; flex-direction: column; gap: 3px; }
  .anz-k { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; line-height: 1.1; }
  .anz-k svg { flex-shrink: 0; }
  .tlbox { flex: 1; min-height: 0; overflow: hidden; }
  .tl { display: grid; grid-template-columns: 34px 1fr; gap: 6px; }
  .tl-t { position: relative; }
  .tl-t div { position: absolute; right: 0; transform: translateY(-50%); font-size: 14px; font-weight: 700; color: var(--muted); }
  .tl-c { position: relative; border-radius: 14px; border: 2px solid var(--line); overflow: hidden; }
  .tl-c .card { gap: 8px; padding: 0 8px; }
  .tl-c .card .lbl { font-size: clamp(15px, 1.6vw, 19px); }
  .tl-c .card.past { opacity: .45; }
  .tl-z { font-size: 14px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
  .tlist { display: flex; flex-direction: column; gap: 8px; overflow: auto; min-height: 0; }
  .task { display: flex; align-items: center; gap: 10px; padding: 4px 10px; min-height: clamp(62px, 11vh, 96px); border-radius: 14px; border: 2px solid var(--line); background: #fff; font-family: inherit; text-align: left; cursor: pointer; }
  .task .w { font-size: clamp(18px, 1.6vw, 24px); font-weight: 700; line-height: 1.15; flex: 1; color: var(--ink); }
  .task .box { width: 44px; height: 44px; border-radius: 10px; border: 3px solid #B5AB9A; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .task.ok { background: #EDF6EC; border-color: #9ACB9F; }
  .task.ok .w { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
  .task.ok .box { background: var(--green); border-color: var(--green); }
  .task svg { flex-shrink: 0; }
  .task > svg:first-child { width: clamp(48px, min(5.2vw, 9vh), 84px); height: auto; }
  .task .w { min-width: 0; -webkit-hyphens: auto; hyphens: auto; overflow-wrap: anywhere; }
  .fest { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
  .fest i { position: absolute; top: -20px; opacity: .95; animation-name: konfetti; animation-timing-function: cubic-bezier(.25,.6,.45,1); animation-fill-mode: forwards; }
  @keyframes konfetti { to { transform: translate(var(--x), 110vh) rotate(var(--r)); } }
  .fest-text { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.4); font-size: clamp(56px, 10vw, 120px); font-weight: 700; color: #FF6F61; text-shadow: 0 4px 0 #fff, 0 6px 18px rgba(42,42,51,.25); -webkit-text-stroke: 2px #fff; white-space: nowrap; animation: lob 2.4s ease-out forwards; }
  .fest-text.gross { color: #43B581; animation-duration: 3.4s; }
  @keyframes lob { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -60%) scale(1); opacity: 0; } }
  .super { margin-top: auto; text-align: center; font-size: 22px; font-weight: 700; color: #3E7A4E; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .todo-empty { flex: 1; border: 3px dashed var(--line); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 20px; font-weight: 700; text-align: center; }
  /* Handy und schmale Bildschirme: alles untereinander, Seite scrollt */
  @media (max-width: 900px), (max-height: 500px) {
    #home { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-auto-rows: max-content; align-content: start; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }
    #home .panel { overflow: visible; min-width: 0; }
    #home .plan { grid-column: 1 / -1; height: min(560px, 75vh); min-height: 380px; overflow: hidden; }
    #home .hlist, #home .tlist { overflow: visible; }
  }
  @media (max-width: 600px) { #home { grid-template-columns: minmax(0, 1fr); gap: 12px; } .anz-kind svg { height: 170px; } .task { min-height: 72px; } .task svg:first-child { width: 60px; height: 60px; } .wday { flex-wrap: wrap; } .wday .rain { font-size: 15px; } }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 14px; font-size: 17px; z-index: 100; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 17px; font-weight: 700; text-align: left; }
  .field input { font-family: inherit; font-size: 20px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; -webkit-user-select: text; user-select: text; }

  /* Handy: Hochformat (schmal) oder Querformat (niedrig) */
  @media (max-width: 700px), (max-height: 500px) {
    .parent { flex-direction: column; }
    .side { width: auto; flex-direction: row; align-items: center; gap: 8px; padding: 8px 10px; position: relative; z-index: 3; box-shadow: 0 2px 8px rgba(42,42,51,.08); }
    .side .brand { display: none; }
    .mtoggle { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 12px; border: 2px solid #D9D1C3; background: #fff; font-size: 17px; font-weight: 700; cursor: pointer; text-align: left; }
    .mtoggle span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side.open .mtoggle .chev { transform: rotate(180deg); }
    .side .tabs { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #F1ECE3; padding: 6px 10px 12px; gap: 4px; box-shadow: 0 10px 24px rgba(42,42,51,.18); max-height: calc(100dvh - 70px); overflow: auto; }
    .side.open .tabs { display: flex; }
    .side .tabs button { height: 46px; font-size: 17px; }
    .side .back { margin: 0; height: 44px; padding: 0 12px; font-size: 15px; white-space: nowrap; }
    .side .back .long { display: none; }

    .main { padding: 14px 12px 24px; gap: 12px; }
    .main h2 { font-size: 23px !important; }
    .main .muted { font-size: 14px !important; }
    .main .row { padding: 10px; gap: 10px; font-size: 15px !important; }
    .pill-btn { height: 40px; padding: 0 14px; font-size: 15px; }
    .filebtn { height: 40px; font-size: 15px; }

    .cards3 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .cards3 .wide { grid-column: 1 / -1; }
    .pcard { padding: 12px; gap: 10px; border-radius: 16px; }
    .pcard input[type=text] { font-size: 17px; padding: 6px 8px; }
    .pcard > span { font-size: 17px !important; }
    .pcard > svg { width: 52px; height: 52px; }
    .pcard .av { width: 72px !important; height: 72px !important; font-size: 32px !important; }
    #addPerson, #addAct { min-height: 140px !important; font-size: 17px !important; }
    .sw { width: 28px; height: 28px; }

    .wk { grid-template-columns: 58px repeat(7, minmax(0, 1fr)); gap: 4px; }
    .wk .hd { height: 32px; font-size: 14px; border-radius: 8px; }
    .wk .rl { font-size: 12px; line-height: 1.15; overflow-wrap: anywhere; -webkit-hyphens: auto; hyphens: auto; }
    .wk .cell { height: 48px; border-radius: 8px; border-width: 1.5px; }
    .wk .cell .av { width: 30px !important; height: 30px !important; font-size: 14px !important; }
    .wk .cell svg { width: 26px; height: 26px; }
    .wk .cell > div:not(.av) { width: 28px !important; height: 28px !important; }
    .timerow { gap: 12px; padding: 10px 12px; }
    .step { font-size: 15px; gap: 6px; }
    .step button { width: 38px; height: 38px; font-size: 20px; }
    .step .val { width: 52px; font-size: 18px; }

    .modes { gap: 6px; }
    .modes button { min-width: 0; flex: 1 1 0; height: 46px; font-size: 14px; gap: 4px; padding: 0 4px; }
    .modes button svg { width: 20px; height: 20px; }
    .month { gap: 4px; }
    .month .wd { font-size: 12px; }

function itemsFor(d) {
  const w = wIdx(d), sp = specialOf(d), out = [];
  const kitaDay = w < 5 && !sp;
  const wk = S.week;
  const over = S.over || {};
  // Standard-Termin mit Änderung für genau diesen Tag
  const std = (slot, s, e, extra) => {
    const o = over[iso(d) + '|' + slot];
    if (o && o.del) return;
    if (o && o.p && extra.person && S.persons[o.p]) { extra.person = o.p; extra.text = S.persons[o.p].name + ({ bringt: ' bringt', abholen: ' holt ab', bett: ': ins Bett' })[slot]; }
    out.push(Object.assign({ id: 'w:' + slot, slot, s: o ? o.s : s, e: o ? o.e : e }, extra));
  };
  const kz = kitaZeit(), P = (k) => S.persons[k];
  // Google-Termine: Rollen (bringt/holt ab/Bett) ersetzen den Standard, der Rest kommt dazu
  const roleOver = {}, gItems = [];
  googleFor(d).filter((g) => !g.allDay).forEach((g) => {
    const s = Math.max(START, g.start), e = Math.min(END, g.end);
    if (e <= START || s >= END) return;
    const m = matchTitle(g.title);
    if (m.day) return;
    if (m.person && m.role && !m.sym) { roleOver[m.role] = { id: 'g:' + g.uid, google: true, title: g.title, s, e: Math.max(e, s + 30), person: m.person }; return; }
    gItems.push({ id: 'g:' + g.uid, google: true, title: g.title, s, e: Math.max(e, s + 30), person: m.sym ? null : m.person, withPerson: m.sym ? m.person : null, sym: m.sym, unknown: !m.person && !m.sym });
  });
  const roleText = { bringt: ' bringt', abholen: ' holt ab', bett: ': ins Bett' };
  Object.keys(roleOver).forEach((r) => { const o = roleOver[r]; o.text = P(o.person).name + roleText[r]; o.slot = r; out.push(o); });
  const realStd = std;
  const stdG = (slot, s, e, extra) => { if (!roleOver[slot]) realStd(slot, s, e, extra); };
  if (kitaDay && P(wk.bringt[w])) stdG('bringt', kz.von - 60, kz.von, { person: wk.bringt[w], text: P(wk.bringt[w]).name + ' bringt' });
  if (kitaDay) out.push({ s: kz.von, e: kz.bis, kita: true, sport: sportAm(d), yoga: yogaAm(d), ausflug: ausflugAm(d), text: kitaTextAm(d) });
  if (kitaDay && P(wk.abholen[w])) stdG('abholen', kz.bis, kz.bis + 60, { person: wk.abholen[w], text: P(wk.abholen[w]).name + ' holt ab' });
  if (wk.nachm[w]) {
    const ns = Math.min(kitaDay ? kz.bis + 60 : 900, END - 60), ne = Math.min(ns + 120, END);
    if (!gItems.some((g) => g.s < ne && g.e > ns)) std('nachm', ns, ne, { sym: wk.nachm[w] });
  }
  if (P(wk.bett[w])) stdG('bett', 1140, 1200, { person: wk.bett[w], text: P(wk.bett[w]).name + ': ins Bett' });
  // Bringen / Abholen / Ins Bett über „Was machst du?“ neu gesetzt – auch wenn die Standard-Woche dafür niemanden hat
  const DEF = { bringt: [kz.von - 60, kz.von], abholen: [kz.bis, kz.bis + 60], bett: [1140, 1200] };
  Object.keys(DEF).forEach((slot) => {
    const o = over[iso(d) + '|' + slot];
    if (!o || o.del || !o.p || !P(o.p) || roleOver[slot] || out.some((it) => it.slot === slot)) return;
    if (slot !== 'bett' && !kitaDay) return;
    out.push({ id: 'w:' + slot, slot, s: o.s != null ? o.s : DEF[slot][0], e: o.e != null ? o.e : DEF[slot][1], person: o.p, text: P(o.p).name + roleText[slot] });
  });
  S.entries.filter((x) => x.date === iso(d)).forEach((x) => out.push({ id: 'e:' + x.id, s: x.start, e: x.end, sym: x.sym, own: true }));
  gItems.forEach((g) => out.push(g));
  // Lange Termine enden vor der Bettzeit, statt daneben zu stehen
  const bett = out.find((it) => it.slot === 'bett');
  if (bett) out.forEach((it) => { if (it !== bett && it.s < bett.s && it.e > bett.s) it.e = bett.s; });
  // … und beginnen erst nach dem Bringen
  const bringt = out.find((it) => it.slot === 'bringt');
  if (bringt) out.forEach((it) => { if (it !== bringt && !it.kita && it.s < bringt.e && it.e > bringt.e && it.s <= bringt.s) it.s = bringt.e; });
  // Nichts nebeneinander: Überschneidungen liegen übereinander, wichtigere oben und leicht eingerückt
  const prio = (it) => it.slot && it.slot !== 'nachm' ? 1 : it.own ? 2 : it.google ? 3 : it.kita ? 5 : 4;
  const order = out.slice().sort((a, b) => prio(b) - prio(a) || a.s - b.s);
  order.forEach((it, i) => {
    it.depth = Math.min(3, order.slice(0, i).filter((o) => !o.kita && o.s < it.e && o.e > it.s).length);
    it.z = 2 + i;
  });
  return order;
}

window.addEventListener('pointerdown', () => { lastActive = Date.now(); }, true);
setInterval(() => {
  if (view === 'cal' && S.settings.start !== 'kalender' && Date.now() - lastActive > 3 * 60000 && !$('layer').innerHTML) { view = 'home'; offset = 0; render(); }
}, 20000);

// ---------- Blättern / Wischen ----------
$('prevBtn').onclick = () => { offset--; render(); };
$('nextBtn').onclick = () => { offset++; render(); };
$('todayBtn').onclick = () => { offset = 0; render(); };
// Wischen mit Finger, Stift oder Maus: nach links = spätere Tage, nach rechts = frühere
let sx = null, sy = null, swipedAt = 0, lastTap = null;
$('grid').addEventListener('pointerdown', (e) => { if (e.isPrimary) { sx = e.clientX; sy = e.clientY; } });
$('grid').addEventListener('pointercancel', () => { sx = null; });
window.addEventListener('pointerup', (e) => {
  if (sx === null || !e.isPrimary) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  sx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) {
    const n = Math.max(1, Math.min(7, S.settings.days || 3));
    const steps = Math.max(1, Math.min(n, Math.round(Math.abs(dx) / Math.max(120, $('grid').clientWidth / n))));
    offset += dx < 0 ? steps : -steps;
    swipedAt = Date.now(); lastTap = null;
    render();
  }
});

const roleSvg = (k, size) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + ROLE_ICON[k].color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ROLE_ICON[k].path + '</svg>';

function openPicker(day, startM) {
  let picked = null, more = false, s = startM, e = Math.min(END, startM + 120);
  let roleMode = false, role = null, rp = null; // Bringen / Abholen / Ins Bett
  const layer = $('layer');
  const kitaDay = wIdx(day) < 5 && !specialOf(day);
  const kz = kitaZeit();
  const DEF = { bringt: [kz.von - 60, kz.von], abholen: [kz.bis, kz.bis + 60], bett: [1140, 1200] };
  const RNAME = { bringt: 'Bringen', abholen: 'Abholen', bett: 'Ins Bett' };
  const ASK = { bringt: 'Wer bringt dich in die Kita?', abholen: 'Wer holt dich ab?', bett: 'Wer bringt dich ins Bett?' };
  const closeX = '<button class="round" id="closeBtn" aria-label="Schließen"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A2A33" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';
  const doneB = (on) => '<button class="done-btn" id="doneBtn"' + (on ? '' : ' disabled') + '><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Fertig</button>';
  function drawRole() {
    const roles = kitaDay ? ['bringt', 'abholen', 'bett'] : ['bett'];
    if (roles.length === 1) role = roles[0];
    let body = '<div class="tiles">' + roles.map((k) => '<button class="tile' + (role === k ? ' on' : '') + '" data-r="' + k + '">' + roleSvg(k, 72) + '<span>' + RNAME[k] + '</span></button>').join('') + '</div>';
    if (role) body += '<div class="step" style="font-size:22px">' + ASK[role] + '</div><div class="tiles">' +
      begleiter().map((k) => '<button class="tile' + (k === rp ? ' on' : '') + '" data-p="' + k + '">' + avatar(k, 72) + '<span>' + esc(S.persons[k].name) + '</span></button>').join('') + '</div>';
    layer.innerHTML = '<div class="overlay" id="ov"><div class="sheet">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        '<div style="display:flex;align-items:center;gap:14px"><button class="round" id="backBtn" aria-label="Zurück"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2A2A33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>' +
          '<div><div class="sub">' + DAYS_LONG[day.getDay()] + (role ? ' · ' + fmt(DEF[role][0]) + ' bis ' + fmt(DEF[role][1]) + ' Uhr' : '') + '</div><h2>' + (kitaDay ? 'Bringen, abholen, ins Bett' : 'Ins Bett') + '</h2></div></div>' +
        closeX + '</div>' + body + doneB(role && rp) + '</div></div>';
    layer.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => { role = b.dataset.r; rp = null; drawRole(); });
    layer.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { rp = b.dataset.p; drawRole(); });
    $('backBtn').onclick = () => { roleMode = false; role = null; rp = null; draw(); };
    $('closeBtn').onclick = close;
    $('ov').onclick = (ev) => { if (ev.target.id === 'ov') close(); };
    $('doneBtn').onclick = () => {
      if (!role || !rp) return;
      S.over = S.over || {};
      S.over[iso(day) + '|' + role] = { s: DEF[role][0], e: DEF[role][1], p: rp };
      save(); close(); render();
    };
  }
  function draw() {
    if (roleMode) return drawRole();
    let tiles = '<button class="tile" id="roleTile">' + roleSvg('alle', 72) + '<span style="text-align:center;line-height:1.15">' + (kitaDay ? 'Bringen · Abholen · Ins Bett' : 'Ins Bett') + '</span></button>';
    Object.keys(SYM).concat(Object.keys(S.acts || {})).forEach((k) => {
      tiles += '<button class="tile' + (picked === k ? ' on' : '') + '" data-k="' + k + '">' + symSvg(k, 72) + '<span>' + esc(symLabel(k)) + '</span></button>';
    });
    const dur = e - s, dh = Math.floor(dur / 60), dm = dur % 60;
    const durT = (dh ? dh + (dh === 1 ? ' Stunde' : ' Stunden') : '') + (dh && dm ? ' ' : '') + (dm ? dm + ' Minuten' : '');
    layer.innerHTML = '<div class="overlay" id="ov"><div class="sheet">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        '<div style="display:flex;align-items:center;gap:14px">' + scene(sceneFor(s), 64) +
          '<div><div class="sub">' + DAYS_LONG[day.getDay()] + ' · ' + fmt(s) + ' bis ' + fmt(e) + ' Uhr</div><h2>Was machst du?</h2></div></div>' +
        '<div style="display:flex;gap:10px;align-items:center">' +
          '<button id="moreBtn" aria-label="Zeit einstellen" style="width:44px;height:44px;border-radius:22px;border:none;background:' + (more ? '#EDE7DD' : 'transparent') + ';cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="#9A9387"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>' +
          '<button class="round" id="closeBtn" aria-label="Schließen"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A2A33" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
        '</div></div>' +
      (more ? '<div class="timerow"><div class="step">Beginn <button data-a="s-">−</button><span class="val">' + fmt(s) + '</span><button data-a="s+">+</button></div>' +
              '<div class="step">Ende <button data-a="e-">−</button><span class="val">' + fmt(e) + '</span><button data-a="e+">+</button></div>' +
              '<span class="muted" style="font-size:18px;margin-left:auto">Dauer: ' + durT + '</span></div>' : '') +
      '<div class="tiles">' + tiles + '</div>' +
      '<button class="done-btn" id="doneBtn"' + (picked ? '' : ' disabled') + '><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Fertig</button>' +
      '</div></div>';
    layer.querySelectorAll('.tile[data-k]').forEach((b) => b.onclick = () => { picked = b.dataset.k; draw(); });
    $('roleTile').onclick = () => { roleMode = true; draw(); };
    layer.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => {
      const a = b.dataset.a;
      if (a === 's-' && s > START) { s -= 30; e -= 30; }
      if (a === 's+' && e < END) { s += 30; e += 30; }
      if (a === 'e-' && e - s > 30) e -= 30;
      if (a === 'e+' && e < END) e += 30;
      draw();
    });
    $('moreBtn').onclick = () => { more = !more; draw(); };
    $('closeBtn').onclick = close;
    $('ov').onclick = (ev) => { if (ev.target.id === 'ov') close(); };
    $('doneBtn').onclick = () => {
      if (!picked) return;
      S.entries.push({ id: Date.now(), date: iso(day), start: s, end: e, sym: picked });
      save(); close(); render();
    };
  }
  function close() { layer.innerHTML = ''; }
  draw();
}

function openEdit(day, it) {
  let s = it.s, e = it.e, confirmDel = false, p = it.person || null, more = false;
  const ROLE = { bringt: ' bringt', abholen: ' holt ab', bett: ': ins Bett' };
  const ASK = { bringt: 'Wer bringt dich in die Kita?', abholen: 'Wer holt dich ab?', bett: 'Wer bringt dich ins Bett?' };
  const canPick = !it.own && p && ROLE[it.slot];
  const layer = $('layer');
  function draw() {
    let icon, label;
    if (p) { icon = avatar(p, 64); label = canPick ? S.persons[p].name + ROLE[it.slot] : it.text; }
    else if (symInfo(it.sym) && symInfo(it.sym).person) { icon = avatar(symInfo(it.sym).person, 64); label = S.persons[symInfo(it.sym).person].name; }
    else { icon = symSvg(it.sym, 64); label = symLabel(it.sym); }
    // Bringen / Abholen / Ins Bett: große Personen-Kacheln, Uhrzeit nur über die drei Punkte
    const picker = canPick ? '<div class="step" style="font-size:22px">' + ASK[it.slot] + '</div><div class="tiles">' +
      begleiter().map((k) => '<button class="tile' + (k === p ? ' on' : '') + '" data-p="' + k + '">' + avatar(k, 72) + '<span>' + esc(S.persons[k].name) + '</span></button>').join('') +
      '</div>' : '';
    const showTime = !canPick || more;
    const dur = e - s, dh = Math.floor(dur / 60), dm = dur % 60;
    const durT = (dh ? dh + (dh === 1 ? ' Stunde' : ' Stunden') : '') + (dh && dm ? ' ' : '') + (dm ? dm + ' Minuten' : '');
    layer.innerHTML = '<div class="overlay" id="ov"><div class="sheet" style="width:min(640px,100%)">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        '<div style="display:flex;align-items:center;gap:16px">' + icon +
          '<div><div class="sub">' + DAYS_LONG[day.getDay()] + ', ' + day.getDate() + '. ' + MONTHS[day.getMonth()] + '</div><h2 style="font-size:30px">' + esc(label) + '</h2></div></div>' +
        '<div style="display:flex;gap:10px;align-items:center">' +
          (canPick ? '<button id="moreBtn" aria-label="Zeit einstellen" style="width:44px;height:44px;border-radius:22px;border:none;background:' + (more ? '#EDE7DD' : 'transparent') + ';cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="#9A9387"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>' : '') +
          '<button class="round" id="closeBtn" aria-label="Schließen"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A2A33" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
        '</div></div>' +
      (showTime ? '<div class="timerow"><div class="step">Beginn <button data-a="s-">−</button><span class="val">' + fmt(s) + '</span><button data-a="s+">+</button></div>' +
        '<div class="step">Ende <button data-a="e-">−</button><span class="val">' + fmt(e) + '</span><button data-a="e+">+</button></div>' +
        '<span class="muted" style="font-size:18px;margin-left:auto">Dauer: ' + durT + '</span></div>' : '') +
      picker +
      (it.own ? '' : '<div class="muted" style="font-size:16px">Gilt nur für diesen Tag. Die Standard-Woche bleibt gleich.</div>') +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        '<button id="delBtn" style="height:52px;padding:0 20px;border-radius:26px;border:2px solid ' + (confirmDel ? '#D6453D' : '#E2DBCF') + ';background:' + (confirmDel ? '#D6453D' : '#fff') + ';color:' + (confirmDel ? '#fff' : '#B3342D') + ';font-size:18px;font-weight:700;cursor:pointer">' + (confirmDel ? 'Wirklich löschen?' : 'Löschen') + '</button>' +
        '<button class="done-btn" id="doneBtn" style="width:240px;height:64px;font-size:24px;align-self:auto"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Fertig</button>' +
      '</div></div></div>';
    layer.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => {
      const a = b.dataset.a;
      if (a === 's-' && s > START) s -= 30;
      if (a === 's+' && s < e - 30) s += 30;
      if (a === 'e-' && e > s + 30) e -= 30;
      if (a === 'e+' && e < END) e += 30;
      confirmDel = false; draw();
    });
    layer.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { p = b.dataset.p; confirmDel = false; draw(); });
    if ($('moreBtn')) $('moreBtn').onclick = () => { more = !more; draw(); };
    $('closeBtn').onclick = close;
    $('ov').onclick = (ev) => { if (ev.target.id === 'ov') close(); };
    $('delBtn').onclick = () => {
      if (!confirmDel) { confirmDel = true; draw(); return; }
      if (it.own) S.entries = S.entries.filter((x) => 'e:' + x.id !== it.id);
      else { S.over = S.over || {}; S.over[iso(day) + '|' + it.slot] = { del: true }; }
      save(); close(); render();
    };
    $('doneBtn').onclick = () => {
      if (it.own) S.entries.forEach((x) => { if ('e:' + x.id === it.id) { x.start = s; x.end = e; } });
      else { S.over = S.over || {}; S.over[iso(day) + '|' + it.slot] = canPick ? { s, e, p } : { s, e }; }
      save(); close(); render();
    };
  }
  function close() { layer.innerHTML = ''; }
  draw();
}

    '<div class="muted" style="font-size:16px">Mehreres geht gleichzeitig. Gilt nur für diesen Tag, die Standard-Woche bleibt gleich.</div>' +
    '<button class="done-btn" id="doneBtn" style="width:240px;height:64px;font-size:24px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Fertig</button></div></div>';
  layer.querySelectorAll('[data-sp]').forEach((b) => b.onclick = () => { const a = b.dataset.sp; wahl[a] = !wahl[a]; b.classList.toggle('on', wahl[a]); });
  $('doneBtn').onclick = () => {
    S.over = S.over || {};
    arten.forEach((a) => { if (wahl[a] !== vorher[a]) S.over[iso(day) + '|' + a] = { on: wahl[a] }; });

  };

  $('ov').onclick = (ev) => { if (ev.target.id === 'ov') layer.innerHTML = ''; };
}

function sceneFor(m) { if (m < 480) return 'morgens'; if (m < 720) return 'vormittag'; if (m < 840) return 'mittag'; if (m < 1080) return 'nachmittag'; return 'abend'; }

// ---------- Eltern-Bereich ----------
$('lockBtn').onclick = openGate;
function openGate() {
  const a = 3 + Math.floor(Math.random() * 7), b = 3 + Math.floor(Math.random() * 7);
  let entry = '', wrong = false;
  const layer = $('layer');
  function draw() {
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✕'];
    layer.innerHTML = '<div class="overlay" id="ov"><div class="sheet" style="width:440px;align-items:center;text-align:center">' +
      '<div class="sub">Eltern-Bereich</div><h2>Was ist ' + a + ' × ' + b + '?</h2>' +
      '<div style="width:200px;height:64px;border-radius:16px;border:3px solid ' + (wrong ? '#D6453D' : '#E2DBCF') + ';background:#FBF8F3;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;letter-spacing:4px">' + (entry || '&nbsp;') + '</div>' +
      (wrong ? '<div style="color:#B3342D;font-weight:700;font-size:17px">Leider falsch. Nochmal!</div>' : '') +
      '<div class="keypad">' + keys.map((k) => '<button data-k="' + k + '">' + k + '</button>').join('') + '</div></div></div>';
    layer.querySelectorAll('.keypad button').forEach((btn) => btn.onclick = () => {
      const k = btn.dataset.k;
      if (k === '✕') { layer.innerHTML = ''; return; }
      if (k === '⌫') { entry = entry.slice(0, -1); wrong = false; draw(); return; }
      if (wrong) { entry = ''; wrong = false; }
      entry += k;
      if (+entry === a * b) { layer.innerHTML = ''; openParent(); return; }
      if (entry.length >= String(a * b).length) wrong = true;
      draw();
    });
  }
  draw();
}

  const curLabel = (tabs.find((t) => t[0] === tab) || tabs[0])[1];

function resizePhoto(file, done) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const size = 240, c = document.createElement('canvas');
    c.width = size; c.height = size;
    const s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
    URL.revokeObjectURL(url);
    done(c.toDataURL('image/jpeg', 0.8));
  };
  img.src = url;
}

function tabBesondere(el) {

    '<button data-m="normal" class="' + (mode === 'normal' ? 'on' : '') + '" style="background:#fff">Normaler Tag</button></div>' +
    '<div style="background:#fff;border:2px solid #E7E1D8;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between"><button class="round" id="mPrev" aria-label="Voriger Monat">‹</button><span style="font-size:24px;font-weight:700">' + MONTHS[mo] + ' ' + y + '</span><button class="round" id="mNext" aria-label="Nächster Monat">›</button></div>' +
    '<div class="month">' + ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((d) => '<div class="wd">' + d + '</div>').join('');
  for (let i = 0; i < lead; i++) h += '<div></div>';
  const tIso = iso(today0());
  for (let n = 1; n <= daysIn; n++) {
    const d = new Date(y, mo, n), k = iso(d), t = S.special[k];
    const bg = t === 'kita' ? '#EEF0F3' : (t === 'urlaub' ? '#FFE3C7' : '#fff');
    const bd = k === tIso ? '3px solid #E0A422' : (t === 'kita' ? '2px solid #8C97A6' : (t === 'urlaub' ? '2px solid #F0A04B' : '2px solid #EFEAE1'));

    h += '<button class="d" data-d="' + k + '" style="background:' + bg + ';border:' + bd + ';color:' + (we ? '#3E7A4E' : '#2A2A33') + '">' + n + (t === 'kita' ? HOUSE_X.replace(/26/g, '20') : (t === 'urlaub' ? CASE.replace(/26/g, '20') : '')) + '</button>';
  }
  h += '</div></div>';
  el.innerHTML = h;

  el.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => {

    save(); tabBesondere(el);
  });
  $('mPrev').onclick = () => { monthOff--; tabBesondere(el); };
  $('mNext').onclick = () => { monthOff++; tabBesondere(el); };
}

    '<div style="display:flex;flex-wrap:wrap;gap:8px">' + werListe().map((w) => '<button class="pill-btn" data-nwer="' + w + '" style="display:flex;align-items:center;gap:8px;' + (werNorm(neuW.wer) === w ? sel : '') + '">' + werBild(w, 28) + esc(werName(w)) + '</button>').join('') + '</div>' +
    '<label class="field">Was?<input id="nwText" type="text" maxlength="60" placeholder="z. B. Müll rausbringen"></label>' +
    '<div style="display:flex;flex-wrap:wrap;gap:8px">' + RHYTHMUS.map(([n, t]) => '<button class="pill-btn" data-nalle="' + n + '" style="' + (neuW.alle === n ? sel : '') + '">' + t + '</button>').join('') + '</div>' +
    '<label class="field">Erster Tag<input id="nwStart" type="date" value="' + iso(today0()) + '"></label>' +
    '<button class="done-btn" id="nwAdd" style="width:240px;height:60px;font-size:22px;align-self:flex-start">Hinzufügen</button></div>';
  const offen = S.aufg.einzel.filter((e) => !e.erledigt);
  h += '<h2 style="font-size:24px;margin-top:10px">Offene einzelne Aufgaben</h2><div class="muted">Werden auf der Startseite mit dem Plus angelegt und verschwinden am Tag nach dem Abhaken.</div>';
  if (!offen.length) h += '<div class="row muted" style="font-size:18px">Keine offenen.</div>';
  offen.forEach((e) => {
    h += '<div class="row">' + werBild(e.wer, 36) + '<div style="flex:1"><div style="font-size:19px;font-weight:700">' + esc(e.wort) + '</div><div class="muted">' + esc(werName(e.wer)) + '</div></div><button class="pill-btn" data-edel="' + esc(e.id) + '">Löschen</button></div>';
  });
  el.innerHTML = h;
  const merk = () => { neuW.text = $('nwText').value; neuW.start = $('nwStart').value; };
  if (neuW.text) $('nwText').value = neuW.text;
  if (neuW.start) $('nwStart').value = neuW.start;
  el.querySelectorAll('[data-nwer]').forEach((b) => b.onclick = () => { merk(); neuW.wer = b.dataset.nwer; tabAufgaben(el); });
  el.querySelectorAll('[data-nalle]').forEach((b) => b.onclick = () => { merk(); neuW.alle = +b.dataset.nalle; tabAufgaben(el); });
  $('nwAdd').onclick = () => {
    const wort = $('nwText').value.trim(), start = $('nwStart').value || iso(today0());
    if (!wort) { $('nwText').focus(); return; }
    S.aufg.wieder.push({ id: 'w' + Date.now(), wer: neuW.wer, wort, start, alle: neuW.alle });
    neuW = { wer: neuW.wer, alle: neuW.alle };
    save(); render(); tabAufgaben(el);
  };
  el.querySelectorAll('[data-wdel]').forEach((b) => b.onclick = () => {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Wirklich?'; b.style.background = '#D6453D'; b.style.color = '#fff'; return; }
    S.aufg.wieder = S.aufg.wieder.filter((a) => a.id !== b.dataset.wdel); save(); render(); tabAufgaben(el);
  });
  el.querySelectorAll('[data-edel]').forEach((b) => b.onclick = () => { S.aufg.einzel = S.aufg.einzel.filter((e) => e.id !== b.dataset.edel); save(); render(); tabAufgaben(el); });
}

function tabGoogle(el) {
  const fmtT = (d) => d ? String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : '–';
  const ok = !G.error && G.at;
  let h = '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2>Google-Kalender</h2><button class="pill-btn" id="gRefresh">Jetzt abrufen</button></div>' +
    '<div class="row" style="font-size:18px"><span style="width:14px;height:14px;border-radius:7px;background:' + (ok ? '#3E8E52' : '#D6453D') + '"></span>' +
    (ok ? 'Verbunden mit dem Kalender „Nora“ · zuletzt abgerufen ' + fmtT(G.at) + ' Uhr · ' + G.events.length + ' Termine'
        : 'Keine Verbindung' + (G.error ? ' (' + esc(G.error) + ')' : '') + '. Ist die Funktion in Supabase eingerichtet und ICAL_URL eingetragen?') + '</div>';
  // Nicht erkannte Termine (jeder Titel einmal)
  const seen = {}, unknown = [];
  G.events.forEach((g) => { const m = matchTitle(g.title); if (!m.person && !m.sym && !m.day && !seen[g.title]) { seen[g.title] = 1; unknown.push(g); } });
  h += '<h2 style="font-size:24px;margin-top:6px">Nicht erkannt (' + unknown.length + ')</h2>';
  if (!unknown.length) h += '<div class="row muted" style="font-size:18px">Alle Termine haben ein Bild.</div>';
  unknown.forEach((g, i) => {
    const d = new Date(g.date + 'T00:00:00');
    h += '<div class="row" style="border-color:#F0C98B"><div style="width:44px;height:44px;border-radius:12px;background:#FFF4E0;color:#C9851B;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px">?</div>' +
      '<div style="flex:1;min-width:0"><div style="font-size:19px;font-weight:700">„' + esc(g.title) + '“</div><div class="muted">' + DAYS_SHORT[d.getDay()] + ' ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + (g.allDay ? ' · ganztägig' : ' · ' + fmt(g.start) + ' Uhr') + '</div></div>' +
      '<button class="pill-btn" data-assign="' + i + '" style="background:#2F6FB0;color:#fff;border-color:#2F6FB0">Zuordnen</button></div>';
  });
  // Stichwörter
  h += '<h2 style="font-size:24px;margin-top:6px">Stichwörter</h2><div class="muted">Steht eines dieser Wörter im Termin, bekommt er das passende Bild. Namen gelten immer automatisch. „Urlaub“ und „Kita zu“ markieren den ganzen Tag.</div>';
  const targets = Object.keys(S.persons).map((k) => [k, avatar(k, 36), S.persons[k].name]).concat(SYM_ACT().map((k) => [k, symSvg(k, 32), symLabel(k)])).concat(Object.keys(DAYTYPES).map((k) => [k, DAYTYPES[k].icon(), DAYTYPES[k].label + ' (ganzer Tag)']));
  targets.forEach(([k, ic, label]) => {
    const words = (S.stich && S.stich[k]) || [];
    h += '<div class="row" style="flex-wrap:wrap">' + ic + '<span style="font-size:18px;font-weight:700;min-width:110px">' + esc(label) + '</span>' +
      words.map((w, j) => '<span style="font-size:15px;padding:4px 6px 4px 10px;border-radius:999px;background:#F1ECE3;display:inline-flex;align-items:center;gap:4px">' + esc(w) + '<button data-rmw="' + k + '|' + j + '" aria-label="Entfernen" style="border:none;background:transparent;font-size:16px;cursor:pointer;color:#7A7468">×</button></span>').join('') +
      '<span style="display:inline-flex;gap:6px;margin-left:auto"><input type="text" data-addw="' + k + '" placeholder="neues Stichwort" style="font-family:inherit;font-size:16px;border:2px solid #E2DBCF;border-radius:10px;padding:6px 10px;width:170px;-webkit-user-select:text;user-select:text">' +
      '<button class="pill-btn" data-addbtn="' + k + '" style="height:40px">+</button></span></div>';
  });
  el.innerHTML = h;
  $('gRefresh').onclick = async () => { $('gRefresh').textContent = 'Wird abgerufen …'; await fetchGoogle(); tabGoogle(el); };
  el.querySelectorAll('[data-assign]').forEach((b) => b.onclick = () => {
    const g = unknown[+b.dataset.assign];
    const opts = targets.map(([k, ic, label]) => [k, ic.replace(/width="32" height="32"/, 'width="44" height="44"'), label]);
    choose('Termin aus Google', '„' + g.title + '“ ist …', opts, null, (k) => {
      if (!k) return;
      S.stich[k] = (S.stich[k] || []).concat([g.title]);
      save(); render(); tabGoogle(el);
    });
  });
  const addWord = (k) => {
    const inp = el.querySelector('[data-addw="' + k + '"]');
    const w = inp.value.trim();
    if (!w) return;
    S.stich[k] = (S.stich[k] || []).concat([w]);
    save(); render(); tabGoogle(el);
  };
  el.querySelectorAll('[data-addbtn]').forEach((b) => b.onclick = () => addWord(b.dataset.addbtn));
  el.querySelectorAll('[data-addw]').forEach((i) => i.onkeydown = (ev) => { if (ev.key === 'Enter') addWord(i.dataset.addw); });
  el.querySelectorAll('[data-rmw]').forEach((b) => b.onclick = () => {
    const [k, j] = b.dataset.rmw.split('|');
    S.stich[k] = S.stich[k].filter((_, n) => n !== +j);
    save(); render(); tabGoogle(el);
  });
}

function tabAnzeige(el) {
  const cur = S.settings.days;
  let h = '<h2>Anzeige</h2><div class="muted" style="font-size:18px">Wie viele Tage sollen nebeneinander zu sehen sein? Für das iPad passen 3 Tage gut, für einen großen Monitor an der Wand zum Beispiel 7 Tage.</div>' +
    '<div class="opts" style="grid-template-columns:repeat(7,minmax(0,1fr))">';
  for (let k = 1; k <= 7; k++) h += '<button class="opt' + (k === cur ? ' on' : '') + '" data-days="' + k + '" style="height:96px"><span style="font-size:34px">' + k + '</span><span>' + (k === 1 ? 'Tag' : 'Tage') + '</span></button>';
  const st = S.settings.start === 'kalender' ? 'kalender' : 'uebersicht';
  const ort = S.settings.ort || WETTER_DEFAULT;
  h += '</div><div class="muted">Die Einstellung gilt für dieses Gerät.</div>' +
    '<h2 style="margin-top:24px">Startseite</h2><div class="muted" style="font-size:18px">Übersicht: heute (ab 17 Uhr morgen), Wetter und Aufgaben. Ohne Bedienung springt der Kalender nach 3 Minuten dorthin zurück.</div>' +
    '<div class="opts" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="opt' + (st === 'uebersicht' ? ' on' : '') + '" data-start="uebersicht" style="height:72px">Übersicht</button><button class="opt' + (st === 'kalender' ? ' on' : '') + '" data-start="kalender" style="height:72px">Kalender</button></div>' +
    '<h2 style="margin-top:24px">Ort für das Wetter</h2><div class="row" style="font-size:18px;flex-wrap:wrap">Jetzt: <b>' + esc(ort.name) + '</b>' +
    '<span class="field" style="margin-left:auto;display:flex;gap:8px"><input id="ortIn" placeholder="Ort suchen" style="width:200px"><button class="pill-btn" id="ortBtn">Übernehmen</button></span></div>' +
    '<div class="muted" id="ortMsg"></div>' +
    '<h2 style="margin-top:24px">Konto</h2><div class="row" style="font-size:18px"><span style="width:14px;height:14px;border-radius:7px;background:' + (online ? '#3E8E52' : '#B5AB9A') + '"></span>' + (online ? 'Angemeldet – Daten sind auf allen Geräten gleich.' : 'Nicht angemeldet – Daten nur auf diesem Gerät.') +
    (online ? '<button class="pill-btn" id="logoutBtn" style="margin-left:auto">Abmelden</button>' : '') + '</div>';
  el.innerHTML = h;
  const lo = document.getElementById('logoutBtn');
  if (lo) lo.onclick = async () => { await sb.auth.signOut(); online = false; document.getElementById('layer').innerHTML = ''; showLogin(); };
  el.querySelectorAll('[data-days]').forEach((b) => b.onclick = () => { S.settings.days = +b.dataset.days; cache(); tabAnzeige(el); });
  el.querySelectorAll('[data-start]').forEach((b) => b.onclick = () => { S.settings.start = b.dataset.start; cache(); tabAnzeige(el); });
  document.getElementById('ortBtn').onclick = async () => {
    const q = document.getElementById('ortIn').value.trim(), msg = document.getElementById('ortMsg');
    if (!q) return;
    msg.textContent = 'Suche …';
    try {
      const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name=' + encodeURIComponent(q));
      const j = await r.json();
      const g = j.results && j.results[0];
      if (!g) { msg.textContent = 'Ort nicht gefunden.'; return; }
      S.settings.ort = { name: g.name, lat: Math.round(g.latitude * 100) / 100, lon: Math.round(g.longitude * 100) / 100 };
      cache(); wetterZeit = 0; ladeWetter(true); tabAnzeige(el);
    } catch (e) { msg.textContent = 'Keine Verbindung.'; }
  };
}

// ---------- Start ----------
window.addEventListener('resize', render);
setInterval(render, 60000);
setInterval(loadRemote, 5 * 60000);
setInterval(fetchGoogle, 15 * 60000);
setInterval(() => ladeWetter(true), 30 * 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadRemote(); });
render();
startSync();
})();
</script>
</body>
</html>
